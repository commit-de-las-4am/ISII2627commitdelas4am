# This workflow will build and deploy an ASP.Net Core Web API to Azure Web App when a commit is pushed to the '115-Faris-ContinuousDelivery' branch or when manually triggered.

name: Build and deploy to Azure Web App - Commit4am

on:
  push:
    branches:
      - '115-Faris-ContinuousDelivery' # Set a branch name to trigger deployment

  pull_request: 
    branches:
      - 'development'     
    # paths:                               #Set a path to trigger deployment
    #   - 'src/AppForSEII.API**'      
      
    types: # triggers the workflow when a PR is closed. 
      - closed      

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    env:
      API: ./src/AppForSEII.API/AppForSEII.API.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          
      - name: Restore dependencies        
        run: |  
          dotnet restore ${{ env.API }}           

      - name: Build with dotnet
        run: |
          dotnet build ${{ env.API }}  --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish ${{ env.API }}  -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    # This condition ensures that the pipeline runs when pushing to the CD branch, or when a PR to development is closed and merged. 
    # If a PR is closed without merging (rejected), the job will be skipped.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Commit4am'
          # slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FARIS }}
          package: .
