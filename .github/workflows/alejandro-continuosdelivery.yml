# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy to Azure Web App - pruebaisii

on:
  push:
    branches:
      - 'Alejandro-ContinuosDelivery'

  pull_request: 
    branches:
      - 'development'     
    # paths:                               #Set a path to trigger deployment
    #   - 'src/AppForSEII.API**'      
      
    types: # triggers the workflow when a PR is closed. 
      - closed     
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    env:
      API: ./src/AppForSEII.API/AppForSEII.API.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          
      - name: Restore dependencies        
        run: |  
          dotnet restore ${{ env.API }}           

      - name: Build with dotnet
        run: |
          dotnet build ${{ env.API }}  --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish ${{ env.API }}  -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:

    # This condition ensures that the pipeline ONLY runs if the PR was closed because it was merged. 
    # If the PR was closed without merging (rejected), the job will be skipped.
    if: github.event.pull_request.merged == true
    
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout


    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      # - name: Login to Azure
      #  uses: azure/login@v2
      #  with:
      #   client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_79D6FE85196040ABA8A9185175E82056 }}
      #   tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0B126E7169A341888A7E2D2A47061305 }}
      #   subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9C4E8B987C1B4B598C7BD5F22EE26A63 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pruebaisii'
          # slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_ALEJANDRO }}
          package: .
          
